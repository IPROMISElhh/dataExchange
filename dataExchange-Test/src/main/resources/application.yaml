# ============================================
# OceanBase 数据源配置（MySQL 租户，使用 MySQL 驱动兼容连接）
# ============================================
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    # Druid的其他属性配置 springboot3整合情况下,数据库连接信息必须在Druid属性下!
    druid:
      url: jdbc:mysql://
      username:
      password:
      driver-class-name: com.mysql.cj.jdbc.Driver

# ============================================
# MQTT 监听配置（订阅 topic → 消息落库到热表）
# ============================================
mqtt:
  # broker 地址（tcp 或 ssl）
  server-url: tcp://localhost:1883
  # 客户端 ID，留空则自动生成 mqtt-data-log- + UUID
  client-id: mqtt-data-log-consumer
  # broker 认证（无认证留空）
  username:
  password:
  # 订阅的 topic 列表，支持通配符（+ / #），如 data/log/#
  topics:
    - data/log/+
  # 订阅 QoS：0-最多一次 1-至少一次 2-恰好一次
  qos: 1
  # keep-alive 心跳间隔（秒）
  keep-alive: 60
  # 连接超时（秒）
  connection-timeout: 10

# ============================================
# 冷热分离业务配置
# ============================================
hotcold:
  # 热数据表名（按天分区，存近期高频数据）
  table-name: data_log_hot
  # 冷数据表名（按天分区，存历史低频数据）
  cold-table-name: data_log_cold
  # 热阈值：本周期访问量 >= 该值 → 判定为热分区
  hot-threshold: 2
  # 冷阈值：本周期访问量 <= 该值 → 判定为冷分区，迁移到冷表
  cold-threshold: 1
  # 冷却时间（秒）：分区迁移后至少等待该时长才允许再次迁移
  cool-down-seconds: 10
  # 分区预建前瞻天数：每日为热表和冷表向前补齐 [今天, 今天+horizon) 的日分区（两表对称）
  horizon-days: 7

# ============================================
# MyBatis 配置
# ============================================
mybatis:
  # Mapper XML 文件存放位置
  mapper-locations: classpath:/mappers/*.xml
  # POJO 别名包，SQL 中可直接使用类名而非全限定名
  type-aliases-package: com.lhh.pojo
  configuration:
    # 开启驼峰命名自动映射（数据库下划线 → Java驼峰）
    map-underscore-to-camel-case: true
    # 开启全量自动映射
    auto-mapping-behavior: full
    # SQL 日志实现，输出到 SLF4J
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
